# Publica una versión de Ctrl Monitor.
#
# - Al subir un tag vX.Y.Z (por ejemplo `git tag v2.7.0 && git push origin v2.7.0`)
#   compila, corre los tests, arma el instalador y el zip portable y los
#   publica en una Release de GitHub.
# - Desde la pestaña Actions («Run workflow») genera los mismos archivos como
#   artefactos descargables, sin crear ninguna Release.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a empaquetar (X.Y.Z). Vacío = el último tag vX.Y.Z."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial y tags completos: sin tag explícito, la versión sale del último vX.Y.Z.
          fetch-depth: 0

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Instalar Inno Setup si falta
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "No se encontró ISCC.exe" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Definir versión
        id: version
        shell: pwsh
        run: |
          # La versión siempre sale de un tag: el csproj queda fijo en 0.0.0.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } elseif ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
          } else {
            # El tag de versión más alto del repo (los tags están en los merges de main).
            $version = git tag --list 'v*.*.*' --sort=-v:refname | Select-Object -First 1
            if (-not $version) { throw "No hay ningún tag vX.Y.Z; indicá la versión al lanzar el workflow." }
          }
          $version = "$version".Trim().TrimStart('v', 'V')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Empaquetar
        shell: pwsh
        run: ./build/package.ps1 -Iscc $env:ISCC -Version '${{ steps.version.outputs.version }}'

      - name: Subir artefactos del workflow
        uses: actions/upload-artifact@v4
        with:
          name: CtrlMonitor-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publicar Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $notes = @"
          ## Ctrl Monitor $version

          **[English](#english) · [Español](#espanol) · [Português (Brasil)](#portugues)**

          <a id="english"></a>
          ### English

          Read-only hardware monitor for Windows 10/11 (64-bit): temperatures, fan speeds, power, voltages, RAM, VRAM and network traffic, plus **disk health (S.M.A.R.T.)** and a **process manager**. Available in English, Spanish and Portuguese (Brazil).

          **Download**
          - **CtrlMonitorSetup-$version.exe**: installer (recommended). Installs to Program Files, creates the Start menu shortcut and can be removed from *Add or remove programs*. It lets you choose the language and can install PawnIO for you.
          - **CtrlMonitor-$version-win-x64-portable.zip**: portable version. Extract it anywhere and run ``CtrlMonitor.exe``.

          .NET is bundled: you don't need to install it.

          **Requirements**
          - Administrator rights (the app asks for them when it opens).
          - [PawnIO](https://pawnio.eu/) to read the motherboard sensors. The installer can download and install it, verifying its SHA-256; without it the app works but shows fewer sensors.

          **Windows SmartScreen**
          The executable isn't digitally signed, so Windows may show "Windows protected your PC". To continue: **More info → Run anyway**. You can verify the files with ``SHA256SUMS.txt``.

          <a id="espanol"></a>
          ### Español

          Monitor de hardware de solo lectura para Windows 10/11 (64 bits): temperaturas, ventiladores, potencia, voltajes, RAM, VRAM y red, más **salud de los discos (S.M.A.R.T.)** y un **administrador de procesos**. Interfaz en español, inglés y portugués (Brasil).

          **Descarga**
          - **CtrlMonitorSetup-$version.exe**: instalador (recomendado). Instala en Program Files, crea el acceso directo en el menú Inicio y se desinstala desde *Agregar o quitar programas*. Permite elegir el idioma y puede instalar PawnIO por vos.
          - **CtrlMonitor-$version-win-x64-portable.zip**: versión portable. Descomprimir donde quieras y ejecutar ``CtrlMonitor.exe``.

          No hace falta instalar .NET: viene incluido.

          **Requisitos**
          - Permisos de administrador (la app los pide al abrir).
          - [PawnIO](https://pawnio.eu/) para leer los sensores de la placa madre. El instalador puede descargarlo e instalarlo verificando su SHA-256; sin él la app funciona, pero muestra menos sensores.

          **Aviso de Windows SmartScreen**
          El ejecutable no está firmado digitalmente, así que Windows puede mostrar «Windows protegió su PC». Para continuar: **Más información → Ejecutar de todas formas**. Podés verificar los archivos con ``SHA256SUMS.txt``.

          <a id="portugues"></a>
          ### Português (Brasil)

          Monitor de hardware somente leitura para Windows 10/11 (64 bits): temperaturas, ventoinhas, potência, tensões, RAM, VRAM e rede, além da **saúde dos discos (S.M.A.R.T.)** e de um **gerenciador de processos**. Interface em inglês, espanhol e português (Brasil).

          **Download**
          - **CtrlMonitorSetup-$version.exe**: instalador (recomendado). Instala em Program Files, cria o atalho no menu Iniciar e pode ser removido em *Aplicativos e recursos*. Permite escolher o idioma e pode instalar o PawnIO para você.
          - **CtrlMonitor-$version-win-x64-portable.zip**: versão portátil. Extraia em qualquer pasta e execute ``CtrlMonitor.exe``.

          Não é necessário instalar o .NET: ele vem incluído.

          **Requisitos**
          - Permissões de administrador (o app as solicita ao abrir).
          - [PawnIO](https://pawnio.eu/) para ler os sensores da placa-mãe. O instalador pode baixá-lo e instalá-lo verificando o SHA-256; sem ele o app funciona, mas mostra menos sensores.

          **Aviso do Windows SmartScreen**
          O executável não é assinado digitalmente, então o Windows pode mostrar "O Windows protegeu o seu PC". Para continuar: **Mais informações → Executar assim mesmo**. Você pode verificar os arquivos com ``SHA256SUMS.txt``.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          gh release create $env:GITHUB_REF_NAME `
            (Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.exe', '.zip', '.txt' }).FullName `
            --title "Ctrl Monitor $version" `
            --notes-file release-notes.md
